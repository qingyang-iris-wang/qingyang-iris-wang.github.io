<!doctype html>
<!-- Simplified from Minimal Light by Yaoyao Liu (CC0 1.0):
     https://github.com/yaoyao-liu/minimal-light -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex">

  <title>Qingyang (Iris) Wang</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #595959;
      font: 18px/1.7 Georgia, "Times New Roman", serif; }
    .wrapper { width: min(940px, calc(100% - 64px)); margin: 90px auto 64px;
      display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 64px; }
    header { text-align: center; }
    .portrait { width: 240px; height: 300px; margin: 0 auto 28px;
      border-radius: 0; background: #f1f2f2; color: #7b858b;
      display: grid; place-items: center; font-size: 40px; font-weight: normal; }
    .portrait img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
    h1, h2 { color: #043361; font-weight: 400; line-height: 1.2; }
    h1 { font-size: 30px; margin: 0 0 12px; }
    h2 { font-size: 28px; margin: 0 0 24px; }
    main { padding-top: 8px; }
    p { margin: 0 0 22px; }
    .links { display: flex; justify-content: center; align-items: center;
      gap: 18px; margin-top: 16px; font: 14px/1.6 system-ui, sans-serif; }
    .separator { color: #a2a8ac; }
    a { color: #043361; text-underline-offset: 4px; }
    a:hover { color: #006699; }
    a:focus-visible { outline: 2px solid #043361; outline-offset: 5px; }
    @media (max-width: 720px) {
      .wrapper { width: min(480px, calc(100% - 40px)); margin-top: 48px;
        grid-template-columns: 1fr; gap: 46px; }
      main { padding-top: 0; }
      .portrait { width: min(240px, 100%); height: auto; aspect-ratio: 4 / 5; margin-bottom: 22px; }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
